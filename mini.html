<!DOCTYPE HTML>
<html>
    <head>
        <title> Mini Project </title>
        <style>
            body{
                background-color: rgb(217, 221, 222);
                color: black;
                font-family: Arial, sans-serif;
            }

           
           

            button{
                background-color: rgb(219, 192, 17);
                color: white;
                padding: 10px 20px;
                border: none;
                cursor: pointer;
            }
            .box{
              display: flex;
              aspect-ratio: 16/9;
              width: 200px;
              height: 250px;
              background-color: rgb(167, 180, 155);
              margin: 20px auto;
              flex-direction: column;
              gap: 15px;
              border: 2px solid rgb(39, 120, 148);
            }
            .input{
                padding: 10px;
                border: 1px solid rgb(26, 15, 175);
                border-radius: 5px;
            }
          </style>
    </head>
    <body >
        <div class="box">
            <h2 align="center"> Login Page </h2>
            <input class="input" type="text" placeholder="Enter your user id "> </input>
            <input type="password" class="input" placeholder="Enter your password "> </input>
            <button style="background-color: rgb(26, 15, 175);
                    color: rgb(193, 156, 156);
                    padding: 10px 20px;
                    border: none;
                    cursor: pointer;
                    border-radius: 5px;"> login / Signup </button>

            </button>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>
            Assignment 17
        </title>
        <style>
            input[type=text], input[type=email], input[type=number], input[type=password], input[type=age] {
                width: 40%;
                padding: 12px 20px; text-align: center;
                margin: 8px 0;
                display: inline-block;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            input[type=submit] {
                width: 40%;
                background-color: #4CAF50; text-align: center;
                color: white;
                padding: 14px 20px;
                margin: 8px 0;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            input[type=submit]:hover {
                background-color: #45a049;
            }
        </style>
    </head>
    <body>
        <input type="text" placeholder="Full name" empty field="please fill out this field" required ><br>
        <input type="email" placeholder="Email" required="@"><br>
        <input type="number" placeholder="10-digit mobile number" required pattern="[0-9]{10}"><br>
        <input type="password" placeholder="Password"  minlength="6" required><br>
        <input type="age" placeholder="Age (17+)" min="17" max="30" required><br>
        <input type="submit" value="register">
    </body>
</html>
